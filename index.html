<body>
  <!-- Sticky section nav. The red rule lives inside it so the two travel together
       and stay pinned; as a sibling above, it just scrolled away. The tab strip
       is centered on the same axis as the main content. On narrow screens it

  <nav id="section-nav" aria-label="Page sections">

    <div class="nav-inner">

        <li><a href="#sec-youtube">YouTube</a></li>
      </ul>
    </div>
  </nav>
  <div id="div-main">
    <!-- PROFILE SIDEBAR (left column on desktop, centered block on mobile) -->
    <aside id="profile-sidebar">
      <div id="row-intro"></div>
    </aside>

    <main id="content-main">
      <table id="table-main">
        <tbody>
          <!-- RESEARCH (About Me) -->

          </tr>

          <!-- NEWS -->
          <!-- <tr class="row-breaker"></tr>

          <!-- OTHER WORK (Codes) -->

  <!-- Floating "back to top" button (fixed to the viewport's bottom-right corner) -->
  <button id="scroll-top-btn" type="button" aria-label="Scroll to top" title="Back to top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <script src="https://www.gstatic.com/firebasejs/8.3.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.3.2/firebase-analytics.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.3.2/firebase-firestore.js"></script>
  <script src="/js/index.js"></script>
  <script>
    $(function () {
      // NOTE: this used to be $.ajaxSetup({ cache: false }), which appends a unique
      // ?_=<timestamp> to every partial and so forces a full re-download of all ten
      // on every visit. GitHub Pages already serves them with an ETag and a short
      // max-age, so the browser revalidates and gets a ~200-byte 304 instead,
      // still fresh, without re-sending the bodies.

      // Fixed-duration animated scroll, shared by the section nav and the
      // back-to-top button (native behavior:'smooth' scales its duration with
      // distance, which feels sluggish on a long page).
      //
      // NOTE ON DURATION: a frame is ~16.7ms at 60Hz, so any duration below that
      // completes in a single frame and renders as an instant jump, because there are no
      // in-between frames to draw. 150ms is about the shortest that still reads as
      // motion rather than a cut. Lower it here to taste.
      var NAV_SCROLL_MS = 150;

      // Users who ask for reduced motion get the jump instead of the glide.
      var reduceMotion = window.matchMedia
        && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function fastScrollTo(targetY, duration) {
        var start = window.pageYOffset || document.documentElement.scrollTop;
        var delta = targetY - start;
        if (!delta) return;
        if (reduceMotion || duration < 17) { window.scrollTo(0, targetY); return; }
        var t0 = null;
        function step(now) {
          if (t0 === null) t0 = now;
          var p = Math.min((now - t0) / duration, 1);
          var eased = 1 - Math.pow(1 - p, 3);   // easeOutCubic
          window.scrollTo(0, Math.round(start + delta * eased));
          if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      // ---- Sticky section nav ------------------------------------------------
      // Sections arrive by AJAX, so the link targets may not exist yet; refresh()
      // is re-run on ajaxComplete and hides links whose section never loaded.
      (function sectionNav() {
        var nav = document.getElementById('section-nav');
        if (!nav) return;
        var strip = nav.querySelector('.nav-scroll');
        var links = Array.prototype.slice.call(nav.querySelectorAll('a[href^="#sec-"]'));
        var live = [];              // {a, el} for sections actually on the page

        function navH() { return nav.offsetHeight; }

        function publishNavHeight() {
          // #profile-sidebar is sticky and must clear the nav
          document.documentElement.style.setProperty('--nav-h', navH() + 'px');
        }

        function setFades() {
          var l = strip.scrollLeft > 2;
          var r = strip.scrollLeft + strip.clientWidth < strip.scrollWidth - 2;
          strip.setAttribute('data-fade', l && r ? 'both' : l ? 'left' : r ? 'right' : 'none');
        }

        // keep the active tab visible in the horizontally scrolling strip
        function revealTab(a) {
          var ar = a.getBoundingClientRect(), sr = strip.getBoundingClientRect();
          if (ar.left < sr.left + 8) strip.scrollLeft -= (sr.left + 8 - ar.left);
          else if (ar.right > sr.right - 8) strip.scrollLeft += (ar.right - (sr.right - 8));
        }

        function setActive(a) {
          links.forEach(function (x) {
            var on = x === a;
            x.classList.toggle('is-active', on);
            if (on) x.setAttribute('aria-current', 'true');
            else x.removeAttribute('aria-current');
          });
          if (a) revealTab(a);
        }

        var holdActiveUntil = 0;

        function updateActive() {
          if (!live.length) return;
          var t = window.performance ? performance.now() : Date.now();
          if (t < holdActiveUntil) return;   // a nav click is still gliding
          var probe = window.pageYOffset + navH() + 24;
          var cur = live[0];
          for (var i = 0; i < live.length; i++) {
            if (live[i].el.getBoundingClientRect().top + window.pageYOffset <= probe) cur = live[i];
          }
          // pinned to the bottom: the last section is the one being read
          if (window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 4) {
            cur = live[live.length - 1];
          }
          setActive(cur.a);
        }

        function refresh() {
          live = [];
          links.forEach(function (a) {
            var el = document.querySelector(a.getAttribute('href'));
            a.parentElement.hidden = !el;
            if (el) live.push({ a: a, el: el });
          });
          publishNavHeight();
          setFades();
          updateActive();
        }

        nav.addEventListener('click', function (e) {
          var a = e.target.closest ? e.target.closest('a[href^="#sec-"]') : null;
          if (!a) return;
          e.preventDefault();
          var el = document.querySelector(a.getAttribute('href'));
          if (!el) return;
          var y = el.getBoundingClientRect().top + window.pageYOffset - navH() - 6;
          // Keep the clicked tab lit for the whole glide, otherwise the scrollspy
          // below would flash through every section the scroll passes over.
          holdActiveUntil = (window.performance ? performance.now() : Date.now())
                            + NAV_SCROLL_MS + 60;
          fastScrollTo(Math.max(0, y), NAV_SCROLL_MS);
          history.replaceState(null, '', a.getAttribute('href'));
          setActive(a);
        });

        var ticking = false;
        function onScroll() {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(function () { updateActive(); ticking = false; });
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', function () { publishNavHeight(); setFades(); updateActive(); });
        strip.addEventListener('scroll', setFades, { passive: true });
        $(document).ajaxComplete(function () { setTimeout(refresh, 50); });

        refresh();

        // deep link: honour #sec-... on load, once its section exists
        if (/^#sec-/.test(location.hash)) {
          var tries = 0;
          var seek = setInterval(function () {
            var el = document.querySelector(location.hash);
            if (el) {
              window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.pageYOffset - navH() - 6));
              updateActive();
              clearInterval(seek);
            } else if (++tries > 40) clearInterval(seek);
          }, 50);
        }
      })();

      // Floating "back to top" button: fast, fixed-duration scroll (native
      // behavior:'smooth' scales with distance and feels slow on a long page).
      $('#scroll-top-btn').on('click', function () {
        fastScrollTo(0, 300);
      });

      // Dark / light mode toggle (icon only; the button lives in intro.html and is
      // loaded via AJAX, so use a delegated click handler and render after it loads).
      function renderDarkModeBtn() {
        var dark = document.documentElement.classList.contains('dark');
        $("#darkmode-btn").html(dark
          ? '<i class="fas fa-sun"></i>'
          : '<i class="fas fa-moon"></i>');
        // hint shows the mode you'll switch to (matches the icon)
        $("#darkmode-tip").text(dark ? 'Light mode' : 'Dark mode');
      }
      $(document).on('click', '#darkmode-btn', function () {
        var dark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
        renderDarkModeBtn();
      });

      // Gameplay video controls (delegated so they work for videos injected
      // via the section partials). Each button acts on the video in its cell.
      function mediaVideoFor(btn) {
        var pair = btn.closest('.media-pair');
        if (pair) return pair.querySelector('.vertical-video');
        // Fallback for single-video cells (e.g. the cloth-sim row): the video in the same cell.
        var cell = btn.closest('.tb-td-left');
        return cell ? cell.querySelector('video') : null;
      }

      // Play / pause the inline video and swap the button icon.
      $(document).on('click', '.media-play', function () {
        var v = mediaVideoFor(this);
        if (!v) return;
        var icon = this.querySelector('i');
        if (v.paused) {
          delete v.dataset.userPaused;              // user wants it playing
          var p = v.play();
          if (p && p.catch) p.catch(function () {});
          if (icon) icon.className = 'fas fa-pause';
        } else {
          v.dataset.userPaused = '1';               // keep it paused even when scrolled back
          v.pause();
          if (icon) icon.className = 'fas fa-play';
        }
      });

      // Autoplay-on-scroll is a desktop convenience, not a mobile one: on a phone
      // it silently pulls a few MB of video over a cell connection just because
      // the reader scrolled past. Skip it on narrow screens, when the OS asks for
      // reduced motion, and when the browser reports data-saver or a slow link.
      // those visits stay on the poster (~65 KB for both) until the reader taps
      // play, which is what the .media-play button already does.
      var autoplayOK = (function () {
        try {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
          if (window.matchMedia('(max-width: 768px)').matches) return false;
          var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
          if (c && (c.saveData || /(^|-)(2g|slow-2g)$/.test(c.effectiveType || ''))) return false;
        } catch (e) { }
        return true;
      })();

      // Keep each button's icon in step with its video no matter what changed the
      // state, whether autoplay, scrolling away, or a tap. play/pause do not bubble, so
      // these listen in the capture phase.
      function syncMediaIcon(v) {
        var pair = v.closest && v.closest('.media-pair');
        var icon = pair && pair.querySelector('.media-play i');
        if (icon) icon.className = v.paused ? 'fas fa-play' : 'fas fa-pause';
      }
      ['play', 'pause'].forEach(function (evt) {
        document.addEventListener(evt, function (e) {
          if (e.target && e.target.tagName === 'VIDEO') syncMediaIcon(e.target);
        }, true);
      });

      // Lazy playback: videos have no `autoplay` and preload="none", so nothing
      // downloads until they scroll into view. This starts them then (loading +
      // playing) and pauses them when they leave, so the initial page load stays
      // tiny (~1-2 MB) instead of eagerly pulling every video (~10 MB).
      var videoIO = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          var v = e.target;
          if (e.isIntersecting) {
            if (autoplayOK && v.paused && !v.dataset.userPaused) {
              var p = v.play();
              if (p && p.catch) p.catch(function () { });
            }
          } else if (!v.paused) {
            v.pause();
          }
        });
      }, { rootMargin: '300px 0px' });

      function observeLazyVideos() {
        document.querySelectorAll('.vertical-video, video.img-zoom').forEach(function (v) {
          if (!v.dataset.lazyObserved) {
            v.dataset.lazyObserved = '1';
            videoIO.observe(v);
          }
        });
      }
      // Run now and again as AJAX-injected sections arrive.
      observeLazyVideos();
      new MutationObserver(observeLazyVideos)
        .observe(document.documentElement, { childList: true, subtree: true });

      // Click a carousel image to open it full-size in a new tab. A small movement
      // threshold means a scroll/swipe drag doesn't count as a click.
      var appImgDown = { x: 0, y: 0 };
      $(document).on('pointerdown', '.app-scroll-item', function (e) {
        appImgDown.x = e.clientX; appImgDown.y = e.clientY;
      });
      $(document).on('click', '.app-scroll-item', function (e) {
        if (Math.abs(e.clientX - appImgDown.x) > 8 || Math.abs(e.clientY - appImgDown.y) > 8) return;
        var src = this.currentSrc || this.src;
        if (src) window.open(src, '_blank');
      });

      // Open the video file in a new browser tab.
      function openVideoInBrowser(v) {
        // data-full: the page plays a small web encode, the new tab gets the original.
        var src = v && ((v.dataset && v.dataset.full) || v.currentSrc || v.src);
        if (src) window.open(src, '_blank');
      }

      // Full-screen button: open the video in a new browser tab.
      $(document).on('click', '.media-fs', function () {
        openVideoInBrowser(mediaVideoFor(this));
      });

      // Clicking the video itself does the same, except where autoplay is off
      // (phones, data-saver), where a still frame reads as "tap to play". There the
      // first tap starts the small web encode; the explicit full-screen button is
      // still the way to pull the multi-MB original.
      $(document).on('click', '.vertical-video, video.img-zoom', function () {
        if (!autoplayOK && this.paused) {
          delete this.dataset.userPaused;
          var p = this.play();
          if (p && p.catch) p.catch(function () { });
          return;
        }
        openVideoInBrowser(this);
      });

      // Clicking the square thumbnail in a video row opens that image in a new tab.
      $(document).on('click', '.tb-td-left--media .media-stack img.img-zoom', function () {
        var src = this.currentSrc || this.src;
        if (src) window.open(src, '_blank');
      });

      // Generic loader: if the partial contains <tr>, replace the placeholder row.
      // Otherwise, inject the HTML as cells inside the existing <tr>.
      function insertRow(rowId, url, afterInsert) {
        $.get(url, function (html) {
          var trimmed = (html || "").trim();
          var hasTR = /<\s*tr[\s>]/i.test(trimmed);    // any <tr ...> in the fragment?
          var $row = $("#" + rowId);

          if (hasTR) {
            // The partial returns one or more <tr> rows -> swap the placeholder row.
            $row.replaceWith(trimmed);
          } else {
            // The partial returns only <td> cells -> keep the row and inject cells.
            $row.html(trimmed);
          }

          if (typeof afterInsert === "function") afterInsert();
        });
      }

      // Initialize contributions after each section loads. Keep its controls local
      // so Work Experience's "Collapse all" does not affect Education.
      function initContributions(sectionId) {
        const $heading = $("#" + sectionId);
        const $section = $heading.closest('tr').next('tr');
        const $buttons = $section.find('.xp-toggle-btn');
        const $contents = $section.find('.xp-toggle-content');
        const $global = $heading.find('.xp-toggle-btn-global');

        function setBtn($btn, open) {
          $btn.data('toggled', open)
              .attr('aria-expanded', open ? 'true' : 'false')
              .text(open ? "Collapse" : "Expand");
        }

        $buttons.off("click").on("click", function () {
          let $btn = $(this);
          let $content = $btn.closest('.xp-contributions').find('.xp-toggle-content');
          let open = !$btn.data('toggled');
          if (open) {
            $content.slideDown();
          } else {
            $content.slideUp();
          }
          setBtn($btn, open);
        });

        // Global toggle
        $global.off("click").on("click", function () {
          let open = !$(this).data('toggled');
          if (open) {
            $contents.slideDown();
          } else {
            $contents.slideUp();
          }
          setBtn($buttons, open);
          $(this).data('toggled', open)
                 .attr('aria-expanded', open ? 'true' : 'false')
                 .text(open ? "Collapse all" : "Expand all");
        });

        // Use each contribution's initial state from its markup on every visit.
        $buttons.each(function () {
          const $btn = $(this);
          const open = $btn.attr('aria-expanded') !== 'false';
          setBtn($btn, open);
          $btn.closest('.xp-contributions').find('.xp-toggle-content').toggle(open);
        });
        $global.data('toggled', true)
                                  .attr('aria-expanded', 'true')
                                  .text('Collapse all');
      }

      // Load all sections
      insertRow("row-intro", "intro.html", renderDarkModeBtn);
      insertRow("row-education", "education.html", function () {
        initContributions("sec-education");
      });
      insertRow("row-research", "research.html");
      insertRow("row-news", "news.html");
      insertRow("row-work", "work.html", function () {
        initContributions("sec-work");
      });
      insertRow("row-otherwork", "otherwork.html");
      insertRow("row-services", "services.html");
      insertRow("row-appdev", "appdev.html");
      insertRow("row-youtube", "youtube.html");

      // Publications needs its expand/collapse wiring after load
      insertRow("row-publication", "publication.html", function () {
        // After the content is loaded, attach the event listeners
        $(".pub-toggle-btn").off("click").on("click", function () {
          let $btn = $(this);
          let $content = $($btn.closest('tr').next('tr').find('.pub-toggle-content'));
          let isToggled = $btn.data('toggled');
          if (isToggled) {
            $content.slideUp();
            $btn.data('toggled', false);
          } else {
            $content.slideDown();
            $btn.data('toggled', true);
          }
          $btn.text($btn.data('toggled') ? "Collapse" : "Expand");
        });

        // Global toggle
        $(".pub-toggle-btn-global").off("click").on("click", function () {
          let isToggled = $(this).data('toggled');
          if (isToggled) {
            $('.pub-toggle-content').slideUp();
            $(this).data('toggled', false);
            $('.pub-toggle-btn').data('toggled', false);
          } else {
            $('.pub-toggle-content').slideDown();
            $(this).data('toggled', true);
            $('.pub-toggle-btn').data('toggled', true);
          }
          let after = $(this).data('toggled');
          $(".pub-toggle-btn").text(after ? "Collapse" : "Expand");
          $(this).text(after ? "Collapse all" : "Expand all");
        });

        $(".pub-toggle-btn-global").data('toggled', false);
        $(".pub-toggle-btn").data('toggled', false);
        $(".pub-toggle-btn-global").text('Expand all');
        $(".pub-toggle-btn").text('Expand');
        $('.pub-toggle-content').hide();
      });

      // Add link previews to all links
      function addLinkPreviews() {
        $('a[href]').each(function () {
          var $link = $(this);
          // Skip if already has preview
          if ($link.closest('.tooltip').length > 0 || $link.parent().hasClass('link-with-preview')) {
            return;
          }
          // Skip links that already have a tooltip sibling
          if ($link.siblings('.link-preview-tooltip, .tooltiptext-image').length > 0) {
            return;
          }
          // Skip video links that already have a thumbnail image inside them
          if ($link.hasClass('video-link') || $link.find('img.thumbnail').length > 0) {
            return;
          }

          var href = $link.attr('href');

          if (!href) return;

          // Check if it's an image
          var imageExts = /\.(jpg|jpeg|png|gif|webp|svg)$/i;
          if (imageExts.test(href)) {
            var $wrapper = $('<span class="link-with-preview"></span>');
            // data-src, not src: these previews only appear on hover, so fetching
            // them up front downloads full-size images nobody may ever look at.
            var $tooltip = $('<span class="link-preview-tooltip"><img data-src="' + href + '" alt="Preview"></span>');
            $link.wrap($wrapper);
            $link.after($tooltip);
          }
          // Check if it's a YouTube video
          else if (/youtube\.com|youtu\.be/i.test(href)) {
            var videoId = '';
            // Extract video ID from various YouTube URL formats
            var match;

            // Pattern 1: youtu.be/VIDEO_ID or youtu.be/VIDEO_ID?params
            if (match = href.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/)) {
              videoId = match[1];
            }
            // Pattern 2: youtube.com/watch?v=VIDEO_ID
            else if (match = href.match(/youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/)) {
              videoId = match[1];
            }
            // Pattern 3: youtube.com/embed/VIDEO_ID
            else if (match = href.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/)) {
              videoId = match[1];
            }
            // Pattern 4: youtube.com/v/VIDEO_ID
            else if (match = href.match(/youtube\.com\/v\/([a-zA-Z0-9_-]{11})/)) {
              videoId = match[1];
            }

            if (videoId && videoId.length === 11) {
              var $wrapper = $('<span class="link-with-preview"></span>');
              var imgSrc = 'https://img.youtube.com/vi/' + videoId + '/maxresdefault.jpg';
              var fallbackSrc = 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg';
              var $img = $('<img>').attr({
                'data-src': imgSrc,          // fetched on first hover, not on load
                'alt': 'Video preview'
              }).on('error', function () {
                if (this.src) $(this).attr('src', fallbackSrc);
              });
              var $tooltip = $('<span class="link-preview-tooltip"></span>').append($img);
              $link.wrap($wrapper);
              $link.after($tooltip);
            }
          }
          // Check if it's a video file
          else if (/\.(mp4|webm|ogg|mov)$/i.test(href) || /vimeo\.com/i.test(href)) {
            var $wrapper = $('<span class="link-with-preview"></span>');
            var $tooltip = $('<span class="link-preview-tooltip link-text">Video: ' + (href.length > 50 ? href.substring(0, 50) + '...' : href) + '</span>');
            $link.wrap($wrapper);
            $link.after($tooltip);
          }
          // Check if it's a PDF
          else if (/\.pdf$/i.test(href)) {
            var $wrapper = $('<span class="link-with-preview"></span>');
            var $tooltip = $('<span class="link-preview-tooltip link-text">PDF Document</span>');
            $link.wrap($wrapper);
            $link.after($tooltip);
          }
          // For external websites, show URL preview
          else if (href.startsWith('http://') || href.startsWith('https://')) {
            if (!href.includes(window.location.hostname) && !href.startsWith(window.location.origin)) {
              var $wrapper = $('<span class="link-with-preview"></span>');
              var displayUrl = href.replace(/^https?:\/\//, '').replace(/\/$/, '');
              var $tooltip = $('<span class="link-preview-tooltip link-text">' + (displayUrl.length > 40 ? displayUrl.substring(0, 40) + '...' : displayUrl) + '</span>');
              $link.wrap($wrapper);
              $link.after($tooltip);
            }
          }
        });
      }

      // Load a preview image the first time its link is hovered or focused.
      // Covers the generated previews above and the markup ones in the partials.
      function loadPreview(el) {
        $(el).find('img[data-src]').each(function () {
          this.src = this.getAttribute('data-src');
          this.removeAttribute('data-src');
        });
      }
      $(document).on('mouseenter', '.link-with-preview, .tooltip', function () {
        loadPreview(this);
      });
      $(document).on('focusin', '.link-with-preview, .tooltip', function () {
        loadPreview(this);
      });

      // Add previews after all content loads
      setTimeout(addLinkPreviews, 800);
      // Also add when new content is loaded
      $(document).ajaxComplete(function () {
        setTimeout(addLinkPreviews, 200);
      });

      // Also run on DOM ready for any links already present
      $(document).ready(function () {
        setTimeout(addLinkPreviews, 1000);
      });


    });
  </script>
</body>

</html>
